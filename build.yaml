# This file generates the GitHub Actions matrix.
#
# Board target note: as of the Zephyr 4.1 update, ZMK uses board revisions and a
# `zmk` variant. `nice_nano_v2` is now `nice_nano@2.0.0//zmk`, short form
# `nice_nano//zmk`. See https://zmk.dev/blog/2025/12/09/zephyr-4-1

include:
  - board: nice_nano//zmk
    shield: charybdis_left
  - board: nice_nano//zmk
    shield: charybdis_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano//zmk
    shield: settings_reset
