# ---------------------------------------------------------------------------
# Shared config - applies to BOTH halves.
# Anything that should only apply to the central (right) half belongs in
# config/boards/shields/charybdis/charybdis_right.conf instead.
# ---------------------------------------------------------------------------

# Bluetooth connection tuning
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# Raise BLE radio TX power to +8dBm - helps with latency and left/right link
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_USB_LOGGING=n

# Battery level report interval, in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Deep sleep - left disabled. Re-enable if you want the battery savings.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
# CONFIG_ZMK_IDLE_TIMEOUT=15000

# Debounce: ZMK defaults to 5ms press / 5ms release, so setting 5/5 was a no-op
# and has been removed. Uncomment and lower for less latency, raise for chatter.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# BLE display name
CONFIG_ZMK_KEYBOARD_NAME="Chary"

# ZMK Studio: enabled via build.yaml cmake-args on the right (central) half only.
# Do NOT set CONFIG_ZMK_STUDIO here - it would build Studio into the peripheral
# too, which just costs RAM.
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
