CONFIG_SPI=y
CONFIG_INPUT=y

# Pointer support. Replaces the old CONFIG_ZMK_MOUSE, which no longer exists.
# NOTE: this changes the HID report descriptor - unpair and re-pair every host
# after flashing.
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

# PMW3610 - badjeff fork. Config prefix is PMW3610_ALT_ to avoid colliding with
# the upstream Zephyr driver.
CONFIG_PMW3610_ALT=y

# CPI, orientation and inversion have moved into devicetree - see
# charybdis_right.overlay. Do not re-add CONFIG_PMW3610_CPI / _ORIENTATION_* /
# _INVERT_* here.

# If the log shows "Incorrect product id 0xFF (expecting 0x3E)!" on nice!nano,
# external power isn't ready at init. Uncomment to delay driver startup.
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Reporting interval in ms - raise to send fewer, larger reports over BLE.
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12

# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
